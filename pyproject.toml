[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "blood-film-analyzer"
version = "0.1.0"
description = "Research POC scaffolding for WBC blood film analysis"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = [
  "torch",
  "torchvision",
  "opencv-python-headless",
  "Pillow",
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "matplotlib",
  "seaborn",
  "timm",
  "ultralytics",
  "albumentations",
  "pydantic",
  "PyYAML",
  "typer",
  "rich",
  "tqdm",
]
dev = ["pytest", "mypy", "ruff"]

[project.scripts]
bloodfilm = "bloodfilm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_data: requires an external dataset on disk",
    "requires_model: requires downloaded model weights",
    "slow: long-running test",
]

[tool.mypy]
# 3.12 so bundled third-party stubs using PEP 695 syntax still parse; ruff's
# py311 target below keeps our own code importable on 3.11.
python_version = "3.12"
strict = true
mypy_path = "src"

# Optional ML/vision backends are absent in minimal checkouts, and some bundled
# stubs are newer than our target version; treat them as opaque Any.
[[tool.mypy.overrides]]
module = [
  "PIL", "PIL.*",
  "numpy", "numpy.*",
  "timm", "timm.*",
  "torch", "torch.*",
  "torchvision", "torchvision.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py311"
